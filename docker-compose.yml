services:
  studio:
    build: .
    env_file: .env
    restart: unless-stopped
    ports:
      - "127.0.0.1:8130:8000"
    volumes:
      - flowforge_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt: ["no-new-privileges:true"]
volumes:
  flowforge_data:
